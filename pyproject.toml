[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-manim-education"
version = "0.1.0"
description = "Structured question understanding for educational Manim explanations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
question-understanding = "hermes_education.question_understanding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
